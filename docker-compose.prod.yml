version: '3.8'

# Production Docker Compose
# Simplified stack for deployment

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agent-dashboard-db
    environment:
      POSTGRES_USER: ${DB_USER:-agentadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-agentdashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agentadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agent-dashboard-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agent-dashboard-api
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-agentadmin}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-agentdashboard}
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DEBUG=false
      - LOG_LEVEL=info
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agent-dashboard-ui
    environment:
      - REACT_APP_API_URL=http://localhost:${API_PORT:-8000}
      - REACT_APP_WS_URL=ws://localhost:${API_PORT:-8000}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - agent-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  agent-network:
    driver: bridge
